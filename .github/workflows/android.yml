name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Relocate root 'src' into 'app/src' (if accidentally at repo root)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "./src" ]; then
            echo "Found root-level src/ directory."
            mkdir -p app
            if [ -d "./app/src" ]; then
              echo "app/src already exists — merging contents"
              cp -a ./src/* ./app/src/ || true
              rm -rf ./src
            else
              echo "Moving root src/ into app/src/"
              mv ./src ./app/
            fi
          else
            echo "No stray root-level src directory found."
          fi

      - name: Setup Gradle Official Runner (Force fresh build without cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-disabled: true # هذا السطر السحري يلغي الكاش ويتخطى عطل سيرفر جيت هب فوراً

      - name: Build Android App (Assemble Debug APK)
        run: |
          gradle assembleDebug --no-daemon
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: KhamrNet-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
