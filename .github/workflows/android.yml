name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle wrapper exists (generate if missing)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            echo "Gradle wrapper already present."
            chmod +x ./gradlew || true
          else
            echo "gradlew not found. Installing Gradle (via sdkman) and generating wrapper..."
            # Install sdkman (non-interactive)
            curl -s "https://get.sdkman.io" | bash
            # shellcheck disable=SC1091
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.2 || sdk install gradle
            gradle wrapper --gradle-version 8.2
            chmod +x ./gradlew
            echo "Gradle wrapper generated."
          fi

      - name: Relocate root 'src' into 'app/src' for this build (if accidentally at repo root)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "./src" ]; then
            echo "Found root-level src/ directory."
            mkdir -p app
            if [ -d "./app/src" ]; then
              echo "app/src already exists — copying contents of root src/ into app/src/"
              cp -a ./src/* ./app/src/ || true
              # remove the root src to avoid confusion in the build
              rm -rf ./src
            else
              echo "Moving root src/ into app/src/"
              mv ./src ./app/
            fi
          else
            echo "No stray root-level src directory found."
          fi

      - name: Print project tree (debug)
        run: |
          echo "Project root listing:"
          ls -la
          echo "app listing:"
          ls -la app || true

      - name: Build (assemble debug)
        shell: bash
        run: |
          set -euo pipefail
          # Use the generated wrapper
          ./gradlew --no-daemon clean assembleDebug
