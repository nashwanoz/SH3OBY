plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.khamrnet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.khamrnet.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }
    
    composeOptions {
        // تم تحديث هذا الإصدار ليتوافق 100% مع إصدار كوتلن 1.9.10 في مشروعك لمنع تعارض الواجهات
        kotlinCompilerExtensionVersion '1.5.3'
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // كوتلن والمكتبات الأساسية
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // واجهات الـ Compose المستقرة
    implementation "androidx.compose.ui:ui:1.5.4"
    implementation "androidx.compose.material:material:1.5.4"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.4"
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    
    // تحديث مكتبة التنقل لحل مشكلة تعارض الـ SQLite والـ Runtime
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // تحديث وضبط مكتبة قاعدة البيانات Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // تحديث مكتبة المزامنة الخلفية لتتوافق مع بقية الحزم السحابية
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // مكتبة منصة Firebase الرسمية وإعدادات الـ Realtime Database
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database-ktx'

    // الكوروتين والعمليات الخلفية للمزامنة
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // أدوات المطورين والمعاينة
    debugImplementation "androidx.compose.ui:ui-tooling:1.5.4"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.5.4"
}
